[project]
name = "shieldpulse"
version = "0.1.0"
description = "ShieldPulse drift ingestion service (Phase 1): HMAC webhook, drift scoring, tenant-isolated PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
