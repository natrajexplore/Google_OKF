name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows checks that .gitattributes keeps validate-okf.sh runnable under autocrlf.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate OKF bundle
        run: bash validate-okf.sh

      - name: Run tests
        run: uv run pytest -v
